<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>B2P · taller de iconos</title>
<script src="../assets/marca.js"></script>
<style>
@font-face{font-family:'Barlow Condensed';font-weight:700;src:url('../assets/fonts/BarlowCondensed-700.woff2') format('woff2');}
body{background:#111;color:#ddd;font-family:monospace;padding:16px}
canvas{border:1px solid #333;margin:6px;image-rendering:pixelated;width:96px;height:96px}
</style>
</head>
<body>
<div id="canvases"></div>
<pre id="out">cargando fuente…</pre>
<script>
// Dibuja el icono BACK2PRIME: fondo tinta, anillo-disco volt, "2" en Barlow Condensed.
function draw(size, maskable) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  const cx = size / 2;
  // fondo
  x.fillStyle = '#0B0D10';
  x.fillRect(0, 0, size, size);
  // halo radial sutil
  const g = x.createRadialGradient(cx, cx * 0.86, size * 0.05, cx, cx, size * 0.72);
  g.addColorStop(0, 'rgba(200,242,78,.14)');
  g.addColorStop(1, 'rgba(200,242,78,0)');
  x.fillStyle = g;
  x.fillRect(0, 0, size, size);
  // escala del arte: en maskable el contenido vive en el 66% central
  const k = maskable ? 0.72 : 0.92;
  const R = size * 0.36 * k;         // radio del disco
  const sw = size * 0.085 * k;       // grosor del anillo
  // anillo base (disco)
  x.lineWidth = sw;
  x.strokeStyle = 'rgba(200,242,78,.32)';
  x.beginPath(); x.arc(cx, cx, R, 0, Math.PI * 2); x.stroke();
  // destello del anillo, abajo a la izquierda: la misma geometria que el
  // trazo de icons/favicon.svg (10 de 151 con offset 47,3: de 113 a 137
  // grados desde las 3 en punto, en sentido horario). El icono y el favicon
  // tienen que ser el mismo dibujo.
  x.strokeStyle = '#C8F24E';
  x.lineCap = 'round';
  x.beginPath(); x.arc(cx, cx, R, Math.PI * 113 / 180, Math.PI * 137 / 180); x.stroke();
  // hub interior sutil
  x.lineWidth = size * 0.012;
  x.strokeStyle = 'rgba(200,242,78,.20)';
  x.beginPath(); x.arc(cx, cx, R * 0.46, 0, Math.PI * 2); x.stroke();
  // el monograma B2P con el 2-flecha: los mismos trazados que el favicon y la
  // cabecera (assets/marca.js). Su tinta ocupa el 76% del diámetro interior del
  // anillo y se centra por la caja de tinta, como antes.
  const M = window.B2P_MARCA;
  const dInterior = 2 * (R - sw / 2);
  const e = (dInterior * 0.76) / M.MONO.w;
  x.save();
  x.translate(cx - M.MONO.cx * e, cx - 50 * e); x.scale(e, e);
  x.fillStyle = '#C8F24E';
  x.fill(new Path2D(M.B));
  x.save(); x.translate(M.P_TX, 0); x.fill(new Path2D(M.P)); x.restore();
  x.save(); x.translate(M.DOS_TX, -10); x.scale(1.836, 1.836); x.translate(-14, -5);
  x.lineWidth = 10; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#C8F24E';
  x.stroke(new Path2D(M.DOS_M)); x.fill(new Path2D(M.PUNTA_M));
  x.restore();
  x.restore();
  document.getElementById('canvases').append(c);
  return c.toDataURL('image/png');
}
Promise.resolve().then(() => {   // ya no hace falta la fuente: el monograma son trazados
  const out = {
    'icon-512.png': draw(512, false),
    'icon-192.png': draw(192, false),
    'apple-touch-icon.png': draw(180, false),
    'maskable-512.png': draw(512, true)
  };
  document.getElementById('out').textContent = JSON.stringify(out);
  window.B2P_ICONS = out;
});
</script>
</body>
</html>
