<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'">
<title>BACK2PRIME</title>
<meta name="description" content="Fuerza, comida y progreso: un plan a tu medida, generado y guardado en tu móvil.">
<meta name="theme-color" content="#0B0D10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- "black" (no "black-translucent"): es lo que usan las otras apps instaladas
     de este equipo y funcionan. Con black-translucent iOS reparte distinto el
     lienzo y deja franja muerta abajo. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BACK2PRIME">
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/iconos.js"></script>
<script>
/* Marca antes del primer pintado si corremos como app instalada (sin barra de
   navegador). Cambia el layout entero: shell fijo vs documento con scroll. */
try {
  if (navigator.standalone === true
      || matchMedia('(display-mode: standalone)').matches
      || matchMedia('(display-mode: fullscreen)').matches) {
    document.documentElement.className = 'pwa';
  }
} catch (e) {}
</script>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div class="brand" id="brand">BACK<span class="b2">2</span>PRIME</div>
    <div class="hdr-sp"></div>
    <span class="streak" id="streak" hidden><span id="streakIco"></span> <span id="streakN">0</span></span>
    <span class="chip" id="chipSem" hidden><span class="dot" id="chipDot"></span><span id="chipTxt"></span></span>
    <button class="icon-btn" id="btnAjustes" aria-label="Mi perfil">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
    </button>
  </div>
</header>

<main id="scroller">
  <!-- sin aria-live: en una SPA que repinta la vista entera, el lector
       intentaba leerla completa en cada cambio. El aviso lo da ahora el
       título del documento y el foco en el h1 (ver render() en app.js). -->
  <div class="wrap" id="view"></div>
</main>

<nav class="tabbar" aria-label="Navegación principal">
  <div class="tabbar-in">
    <button class="tab" data-r="hoy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <span>Hoy</span>
    </button>
    <button class="tab" data-r="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Plan</span>
    </button>
    <button class="tab" data-r="nutricion">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>
      <span>Comida</span>
    </button>
    <button class="tab" data-r="progreso">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
      <span>Progreso</span>
    </button>
    <button class="tab" data-r="logros">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M9 14.5 7 22l5-3 5 3-2-7.5"/></svg>
      <span>Logros</span>
    </button>
  </div>
</nav>

<!-- Overlays -->
<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1" inert></div>

<div class="timer" id="timer">
  <span class="tt" id="timerT">0:00</span>
  <button id="timerPlus">+30″</button>
  <button id="timerX">✕</button>
</div>

<button class="updpill" id="updPill" type="button" hidden></button>
<div class="toast" id="toast"></div>

<canvas id="confetti" hidden></canvas>
<div class="celebra-bg" id="celebraBg">
  <div class="celebra">
    <div class="ci" id="celebraIcon"></div>
    <div class="cn" id="celebraNombre"></div>
    <div class="cd" id="celebraDesc"></div>
    <button class="cok" id="celebraOk">Seguimos</button>
  </div>
</div>

<script src="assets/data.js"></script>
<script>
/* Idioma: si hay uno guardado distinto de español, se carga su data.<lang>.js
   ENCIMA (sustituye window.B2P entero, contenido + textos de interfaz).
   document.write garantiza el orden: idioma cargado antes que app.js. */
(function () {
  try {
    var lang = ((JSON.parse(localStorage.b2p_v1 || '{}').config || {}).lang) || 'es';
    if (['en', 'fr', 'de', 'it', 'pt'].indexOf(lang) >= 0) {
      document.write('<scr' + 'ipt src="assets/data.' + lang + '.js"></scr' + 'ipt>');
    }
  } catch (e) { }
})();
</script>
<script src="assets/gen.js"></script>
<script src="assets/mapa.js"></script>
<script src="assets/fotos.js"></script>
<script src="assets/pictos.js"></script>
<script src="assets/deportes.js"></script>
<script src="assets/nativo.js"></script>
<script src="assets/app.js"></script>
<script src="assets/views.js"></script>
<script src="assets/onb.js"></script>
<script>
/* Dentro de la app de tienda los ficheros ya son locales: un service worker
   cache-first encima solo puede servir una version vieja despues de que la
   tienda actualice la app. */
var esApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())
  || location.protocol === 'capacitor:';
if ('serviceWorker' in navigator && location.protocol !== 'file:' && !esApp) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
