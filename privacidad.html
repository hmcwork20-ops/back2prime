    { t: 'Combien de temps',

    { t: 'Tes droits, et comment les exercer',
      p: ["Le règlement te donne le droit d'accéder à tes données, de les rectifier, de les effacer, de les emporter, de t'opposer au traitement, de le limiter et de retirer ton consentement. Presque tout, tu peux le faire toi-même, sans demander et sans attendre :"],

  intro: 'BACK2PRIME baut aus dem, was du über dich erzählst, einen Trainings- und Essensplan. Dafür braucht es Daten, und manche davon sind Gesundheitsdaten. Diese Seite sagt welche, wo sie liegen, wie lange und was du damit machen kannst. Sie ist zum Verstehen geschrieben, nicht zur Absicherung.',

    { t: 'Welche Daten erhoben werden',

          '<b>Dein Name:</b> der, den du am Anfang eingibst, bis 24 Zeichen. Ein Spitzname geht völlig in Ordnung.',

          '<b>Wenn du eine Meldung schickst</b> über die Melde-Blase: der Text, zwischen 4 und 2000 Zeichen; ob es ein Fehler, eine Idee oder etwas anderes ist; und der technische Kontext zum Nachvollziehen, also Version, Plattform, Sprache, der Bildschirm, auf dem du warst, die Bildschirmgröße und die ersten 180 Zeichen der Kennung deines Browsers. Nichts aus deinem Plan, deinem Gewicht oder deinen Einträgen geht mit.',
          '<b>Wenn du deinen Plan per Link teilst:</b> eine Kopie des Plans, abgelegt unter einem zufälligen Code. Wer den Link hat, sieht diesen Plan und sonst nichts: nicht deine Einträge, nicht dein Gewicht, nicht deine E-Mail.'] },

    { t: 'Gesundheitsdaten, gesondert',
      p: ['Gewicht, Taille, Verletzungen und die ärztliche Freigabe sind Gesundheitsdaten. Die europäische Verordnung schützt sie stärker als den Rest, und das zu Recht.',
          'Rechtsgrundlage für ihre Verarbeitung ist deine <b>ausdrückliche Einwilligung</b>: du gibst sie im Fragebogen, damit die App deinen Plan berechnen kann. Sie werden nur dafür genutzt. Du kannst die Einwilligung jederzeit widerrufen, indem du dein Konto löschst, und sie verschwinden mit ihm.',
          'Ohne diese Daten kann die App keinen Plan erzeugen. Es gibt keine Version, die ohne sie funktioniert, und dir etwas anderes zu sagen wäre gelogen.'] },

    { t: 'Wofür sie genutzt werden',
      p: ['Für genau eine Sache: deinen Plan bauen und deinen Fortschritt verfolgen.',
          'Sie werden nicht zum Profiling genutzt, nicht verkauft, an niemanden weitergegeben und mit keiner anderen Quelle zusammengeführt. Es gibt keine automatisierten Entscheidungen mit rechtlicher Wirkung für dich: der Plan ist ein Trainings- und Ernährungsvorschlag, keine Diagnose und keine ärztliche Beratung.'] },

    { t: 'Was nicht passiert',
      l: ['Keine Analytik, keine Messung einzelner Nutzung. Wir wissen nicht, welche Bildschirme du ansiehst.',

    { t: 'Wo die Daten liegen',

          '<b>Bei Supabase:</b> die Kopie, die deine Geräte abgleicht und dir den Plan auf einem neuen Handy zurückgibt. Das Projekt liegt in der <b>Europäischen Union</b>, deine Daten verlassen den Europäischen Wirtschaftsraum also nicht.',

          '<b>Ein technisches Cookie:</b> vor Supabase steht Cloudflare und setzt ein Cookie zur Verkehrssteuerung auf der eigenen Domain. Es ist nicht da, um dir durchs Internet zu folgen, sondern um einen Browser von einem Bot zu unterscheiden.'] },

    { t: 'Wie lange',

          'Was auf deinem Gerät liegt, löschst du selbst, durch Deinstallieren der App oder Leeren der Browserdaten.'] },

    { t: 'Deine Rechte, und wie du sie nutzt',
      p: ['Die Verordnung gibt dir das Recht auf Auskunft, Berichtigung, Löschung, Datenübertragbarkeit, Widerspruch, Einschränkung der Verarbeitung und Widerruf der Einwilligung. Fast alles kannst du selbst tun, ohne zu fragen und ohne zu warten:'],
      l: ['<b>Auskunft und Mitnahme:</b> in Mein Profil, unter Einstellungen, lädt ein Knopf deinen kompletten Stand als JSON-Datei herunter. Das ist alles, was es über dich gibt, genau so wie es gespeichert ist.',
          '<b>Berichtigung:</b> indem du den Fragebogen aus Mein Profil neu machst.',
          '<b>Löschung und Widerruf:</b> Mein Profil, Konto löschen.'],
      p2: ['Für alles, was du nicht selbst kannst, schreib an <a href="mailto:{C}">{C}</a>. Die Antwort kommt spätestens in einem Monat, so sieht es die Verordnung vor.',
           'Wenn du meinst, etwas sei falsch gelaufen, kannst du dich bei deiner nationalen Datenschutzbehörde beschweren. In Deutschland ist das die zuständige Landesbehörde oder der Bundesbeauftragte, unter <a href="https://www.bfdi.bund.de" rel="noopener">www.bfdi.bund.de</a>.'] },

    { t: 'Minderjährige',
      p: ['BACK2PRIME ist nicht für Menschen unter 16, und der Fragebogen nimmt kein geringeres Alter an.',

    { t: 'Sicherheit',
      p: ['Alles reist verschlüsselt über HTTPS. Passwörter liegen als kryptografischer Hash, nie im Klartext.',
          'In der Datenbank ist jede Zeile durch Zugriffsregeln geschützt, die auf dem Server greifen: selbst wenn jemand die Adresse im Browser ändert oder die API von Hand aufruft, sieht und ändert er nur das Eigene. Die Website erklärt außerdem eine Content-Security-Policy, die das Laden fremden Codes verhindert.',
          'Kein System ist unfehlbar, und das Gegenteil zu versprechen wäre absurd, aber das ist, was eingebaut ist.'] },

    { t: 'Wenn sich das ändert',
      p: ['Dann ändert sich das Datum oben. Betrifft die Änderung, wofür deine Daten genutzt werden, wirst du erneut um Einwilligung gebeten, statt dass sie vorausgesetzt wird.'] },

    { t: 'Kontakt',

  ]
};

  pie: 'BACK2PRIME · forza e cibo, un piano su misura per te.',

  secciones: [
    { t: 'Chi risponde dei tuoi dati',
      p: ['BACK2PRIME è un progetto personale, non un’azienda. Risponde dei tuoi dati la persona che lo mantiene, e puoi scriverle a <a href="mailto:{C}">{C}</a> per qualsiasi cosa riguardi questa pagina.'] },

    { t: 'Quali dati si raccolgono',
      p: ['Li dai tutti tu. Niente viene raccolto alle tue spalle.'],
      l: ["<b>Per avere un account:</b> la tua e-mail e una password. La password la gestisce Supabase, il fornitore di autenticazione: viaggia cifrata, viene salvata come impronta crittografica, e né l'app né noi la vediamo mai.",
          '<b>Il tuo nome:</b> quello che scrivi all’inizio, fino a 24 caratteri. Un soprannome va benissimo.',
          "<b>Il questionario:</b> sesso, età, altezza, peso, girovita, obiettivo, per quando lo vuoi, quanto dura, se vieni da un periodo di allenamento o no, giorni a settimana, minuti a sessione, fascia della giornata, attrezzatura che hai, infortuni a ginocchio, spalla o zona lombare, se hai il via libera del medico, tipo di dieta, intolleranze, e quali piatti, sport ed esercizi ti piacciono o no.",
          '<b>Quello che registri ogni giorno:</b> peso, girovita, esercizi fatti, minuti di cardio, se hai chiuso la sessione e il lavoro sui tendini.',
          "<b>Quello che l'app ricava da tutto questo:</b> traguardi, record personali, la lista della spesa spuntata e la lingua che usi.",
          "<b>Se mandi una segnalazione</b> dalla bolla: il testo, tra 4 e 2000 caratteri; se è un errore, un’idea o altro; e il contesto tecnico per poterla riprodurre, cioè versione, piattaforma, lingua, la schermata in cui eri, la dimensione dello schermo e i primi 180 caratteri dell'identificativo del tuo browser. Non parte nulla del tuo piano, del tuo peso o dei tuoi registri.",
          "<b>Se condividi il piano con un link:</b> una copia del piano, salvata sotto un codice casuale. Chi ha il link vede quel piano e nient'altro: né i tuoi registri, né il tuo peso, né la tua e-mail."] },

    { t: 'I dati sulla salute, a parte',
      p: ['Peso, girovita, infortuni e via libera medico sono dati sulla salute. Il regolamento europeo li protegge più degli altri, e fa bene.',
          "La base giuridica per trattarli è il tuo <b>consenso esplicito</b>: li dai tu, nel questionario, perché l'app possa calcolare il tuo piano. Servono solo a quello. Puoi ritirare il consenso quando vuoi cancellando l'account, e spariscono con lui.",
          "Senza quei dati l'app non può generare un piano. Non esiste una versione che funzioni senza, e dirti il contrario sarebbe una bugia."] },

    { t: 'A cosa servono',
      p: ['A una cosa sola: costruire il tuo piano e seguire i tuoi progressi.',
          'Non servono a profilarti, non si vendono, non si cedono a nessuno e non si incrociano con nessun’altra fonte. Non ci sono decisioni automatizzate con effetti giuridici su di te: il piano è una proposta di allenamento e di alimentazione, non una diagnosi né un consiglio medico.'] },

    { t: 'Quello che non si fa',
      l: ['Nessuna analitica e nessuna misurazione di uso individuale. Non sappiamo quali schermate guardi.',
          'Nessuna pubblicità e nessun tracciatore di terzi.',
          'Non si raccolgono posizione, contatti, foto né calendario.',

    { t: 'Dove stanno i dati',

          '<b>Su Supabase:</b> la copia che sincronizza i tuoi dispositivi e ti fa ritrovare il piano cambiando telefono. Il progetto è ospitato nell’<b>Unione Europea</b>, quindi i tuoi dati non escono dallo Spazio Economico Europeo.',
          '<b>Su GitHub Pages:</b> solo il sito in sé, i file. Come qualsiasi server al mondo, GitHub registra indirizzi IP nei propri log, per sicurezza e per servire la pagina.',
          '<b>Un cookie tecnico:</b> davanti a Supabase c’è Cloudflare, che mette un cookie di gestione del traffico sul proprio dominio. Non serve a seguirti in giro per internet: serve a distinguere un browser da un robot.'] },

    { t: 'Per quanto tempo',
      p: ['Finché hai un account.',
          'Quando lo cancelli da <b>Il mio profilo</b>, il tuo utente viene cancellato e con lui, a cascata e subito: il tuo stato, il piano condiviso se ce l’avevi, e le segnalazioni che avevi mandato. Non si tiene una copia per sicurezza.',
          "Quello che sta sul tuo dispositivo lo cancelli tu, disinstallando l'app o pulendo i dati del browser."] },

    { t: 'I tuoi diritti, e come usarli',
      p: ['Il regolamento ti dà diritto ad accedere ai tuoi dati, correggerli, cancellarli, portarteli via, opporti al trattamento, limitarlo e ritirare il consenso. Quasi tutto puoi farlo da solo, senza chiedere e senza aspettare:'],
      l: ['<b>Accedere e portarteli via:</b> ne Il mio profilo, in Impostazioni, un pulsante ti scarica tutto il tuo stato in un file JSON. È tutto quello che esiste su di te, così com’è salvato.',
          '<b>Correggerli:</b> rifacendo il questionario da Il mio profilo.',
          '<b>Cancellarli e ritirare il consenso:</b> Il mio profilo, elimina account.'],

           'Se pensi che qualcosa sia stato fatto male, puoi rivolgerti alla tua autorità nazionale. In Italia è il Garante per la protezione dei dati personali, su <a href="https://www.garanteprivacy.it" rel="noopener">www.garanteprivacy.it</a>.'] },

    { t: 'Minori',
      p: ['BACK2PRIME non è per chi ha meno di 16 anni, e il questionario non accetta età inferiori.',
          'Se sei genitore o tutore di un minore che ha creato un account, scrivi a <a href="mailto:{C}">{C}</a> e viene cancellato.'] },

    { t: 'Sicurezza',
      p: ['Tutto viaggia cifrato su HTTPS. Le password sono salvate come impronta crittografica, mai in chiaro.',
          "Nel database ogni riga è protetta da politiche di accesso applicate sul server: anche se qualcuno cambia l'indirizzo nel browser o chiama l'API a mano, può vedere e toccare solo il proprio. Il sito dichiara inoltre una politica di sicurezza dei contenuti che impedisce di caricare codice di terzi.",
          'Nessun sistema è infallibile e promettere il contrario sarebbe assurdo, ma questo è quello che c’è.'] },

    { t: 'Se questo cambia',
      p: ['Cambia la data qui sopra. Se il cambiamento riguarda a cosa servono i tuoi dati, il consenso ti verrà chiesto di nuovo invece di darlo per scontato.'] },

    { t: 'Contatto',
      p: ['<a href="mailto:{C}">{C}</a>'] }
  ]

/* ============================ pintado ============================ */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

/* El texto lleva enlaces a propósito (correo, autoridad de control), así que
   no se escapa entero: se escapan los TÍTULOS, que son texto plano, y el
   cuerpo se escribe tal cual desde este mismo fichero. No entra nada de
   fuera: ni del usuario, ni de la red, ni de la URL. */
function pinta(lang) {
  var t = T[lang] || T.es;
  document.documentElement.lang = lang;
  document.title = t.titulo + ' · BACK2PRIME';

  var h = '<h1>' + esc(t.titulo) + '</h1>';
  h += '<p class="fecha">' + esc(t.fecha) + '</p>';
  h += '<p class="intro">' + esc(t.intro) + '</p>';

  for (var i = 0; i < t.secciones.length; i++) {
    var s = t.secciones[i], j;
    h += '<section><h2>' + esc(s.t) + '</h2>';
    if (s.p) for (j = 0; j < s.p.length; j++) h += '<p>' + s.p[j] + '</p>';
    if (s.l) { h += '<ul>'; for (j = 0; j < s.l.length; j++) h += '<li>' + s.l[j] + '</li>'; h += '</ul>'; }
    if (s.p2) for (j = 0; j < s.p2.length; j++) h += '<p>' + s.p2[j] + '</p>';
    h += '</section>';
  }
  document.getElementById('doc').innerHTML = h.split('{C}').join(CONTACTO);
  document.querySelector('#volver span').textContent = t.volver;
  document.getElementById('pie').textContent = t.pie;

  var bs = document.querySelectorAll('#idiomas button');
  for (var k = 0; k < bs.length; k++)
    bs[k].setAttribute('aria-current', bs[k].dataset.lang === lang ? 'true' : 'false');

  try { history.replaceState(null, '', '?lang=' + lang); } catch (e) {}
}

/* Qué idioma: el de la URL manda (para poder enlazar a uno concreto), luego
   el que la persona eligió en la app, luego el del navegador, y si nada
   encaja, español. */
function idiomaInicial() {
  var q = (location.search.match(/[?&]lang=([a-z]{2})/) || [])[1];
  if (q && T[q]) return q;
  try {
    var S = JSON.parse(localStorage.getItem('b2p_v1') || '{}');
    if (S.config && T[S.config.lang]) return S.config.lang;
  } catch (e) {}
  var nav = (navigator.language || 'es').slice(0, 2).toLowerCase();
  return T[nav] ? nav : 'es';
}

(function () {
  var nav = document.getElementById('idiomas');
  for (var i = 0; i < IDIOMAS.length; i++) {
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.lang = IDIOMAS[i][0];
    b.textContent = IDIOMAS[i][1];
    b.addEventListener('click', function () { pinta(this.dataset.lang); });
    nav.appendChild(b);
  }
  pinta(idiomaInicial());
})();
</script>
